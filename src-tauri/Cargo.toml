[package]
name = "app"
version = "0.1.8"
description = "Codex quota floating window for Windows"
authors = ["nf2huochao"]
license = ""
repository = "https://github.com/nf2huochao/Codex-Floating-ball"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.8.0", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread"] }
tokio-stream = "0.1"
axum = { version = "0.8", features = ["ws"] }
uuid = { version = "1", features = ["v4"] }
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"
