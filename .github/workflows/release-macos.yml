name: Release macOS Apple Silicon

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to receive the macOS test package"
        required: true
        default: "v1.0.5"

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-14
    concurrency:
      group: quotaorb-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: npm run build
      - name: Verify updater signing secrets
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Missing TAURI_SIGNING_PRIVATE_KEY repository secret."; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secret."; exit 1; }
      - name: Build Apple Silicon app and DMG
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Codex 额度悬浮窗 ${{ env.RELEASE_TAG }}
          releaseBody: |
            ## 本次更新 / Release notes

            - 设置页增加一键生成脱敏诊断报告：本地保存、先预览、由用户自行决定是否发送。
            - 每次启动后只检查一次新版本；仅发现新版本时提醒，安装仍需确认。
            - 修复大日志中正在运行的对话漏同步；兼容实际 Token 统计格式，统计记录不会复活已完成任务。
            - 修复配对试错限制绕过、设置连续操作冲突与旧诊断报告残留。
            - Added a local, redacted diagnostic report with a reviewable preview and no automatic upload.
            - Checks for updates once after launch; only new versions prompt, and installation requires consent.
            - Fixes active task discovery in large logs, token record compatibility, pairing cooldown and settings races.
            - Windows includes updater-signed artifacts. The Apple Silicon macOS package is not Apple-notarized and remains a test build.

            详细说明见仓库中的 CHANGELOG.md。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: --target aarch64-apple-darwin --ci
      - name: Merge macOS entry into updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codex-manifest"
          manifest="$RUNNER_TEMP/codex-manifest/latest.json"
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$RUNNER_TEMP/codex-manifest" || true
          if [ ! -f "$manifest" ]; then
            printf '{"version":"%s","notes":"Codex QuotaOrb %s","platforms":{}}\n' "${RELEASE_TAG#v}" "$RELEASE_TAG" > "$manifest"
          fi
          signature_file="$(find src-tauri/target -type f -name '*.app.tar.gz.sig' -print -quit)"
          test -n "$signature_file" || { echo "macOS updater signature was not generated."; exit 1; }
          signature="$(tr -d '\r\n' < "$signature_file")"
          artifact_url="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.name | endswith(".app.tar.gz")) | .url' | head -n 1)"
          test -n "$artifact_url" || { echo "macOS updater artifact was not found in release."; exit 1; }
          tmp="$RUNNER_TEMP/codex-manifest/latest.merged.json"
          jq --arg version "${RELEASE_TAG#v}" \
             --arg signature "$signature" \
             --arg url "$artifact_url" \
             '.version = $version
              | .platforms = (.platforms // {})
              | .platforms["darwin-aarch64"] = {signature: $signature, url: $url}' \
             "$manifest" > "$tmp"
          mv "$tmp" "$manifest"
          gh release upload "$RELEASE_TAG" "$manifest" --clobber
