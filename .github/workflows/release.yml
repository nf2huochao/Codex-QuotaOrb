name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:ui
      - name: Verify updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY repository secret. See docs/release-signing.md."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secret. See docs/release-signing.md."
          }
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Codex 额度悬浮窗 ${{ github.ref_name }}
          releaseBody: |
            ## 本次更新 / Release notes

            - Plus 套餐现在分别显示 5 小时额度、周额度和对应重置时间。
            - 近期趋势改为固定最近 7 天 × 24 小时的一行细柱，共 168 个位置；桌面端和手机网页端均完整显示。
            - 去除滚轮切换和原生滑轨，未采样小时保持空白，不沿用旧值。
            - 保持悬浮球、详情页和手机局域网网页的任务快照、Token 日期和状态统计一致。
            - Signed Windows installer and updater manifest are included when repository signing secrets are configured.

            详细说明见仓库中的 CHANGELOG.md。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
