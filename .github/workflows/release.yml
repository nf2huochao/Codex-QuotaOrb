name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:ui
      - name: Verify updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY repository secret. See docs/release-signing.md."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secret. See docs/release-signing.md."
          }
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Codex 额度悬浮窗 ${{ github.ref_name }}
          releaseBody: |
            ## 本次更新 / Release notes

            - 增加 Codex 路径自动检测和手动指定，Windows 优先使用当前 npm 安装版本。
            - Codex 用量接口暂时超时时仍保留最新额度显示，旧用量保留并自动重试。
            - 错误提示区分超时、网络、登录和协议问题。
            - Added automatic and user-selected Codex executable paths, with graceful quota fallback when usage data is temporarily unavailable.
            - Signed Windows installer, `latest.json`, and `.sig` are included when repository signing secrets are configured.

            详细说明见仓库中的 CHANGELOG.md。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
      - name: Publish updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $signatureFile = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe.sig" | Select-Object -First 1
          if ($null -eq $signatureFile) { throw "Updater signature was not generated." }
          $signature = (Get-Content -Raw $signatureFile.FullName).Trim()
          $release = gh release view $tag --json assets | ConvertFrom-Json
          $installer = $release.assets | Where-Object { $_.name -like "*-setup.exe" } | Select-Object -First 1
          if ($null -eq $installer) { throw "Windows installer asset was not found in release $tag." }
          $manifest = [ordered]@{
            version = "${{ github.ref_name }}" -replace '^v', ''
            notes = "Codex QuotaOrb $tag"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                # gh release view exposes the public download URL as `url`.
                # `browserDownloadUrl` is not a valid asset field and would
                # silently publish a null updater URL.
                url = $installer.url
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath latest.json -Encoding utf8NoBOM
          gh release upload $tag latest.json --clobber
