name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    concurrency:
      group: quotaorb-release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:ui
      - name: Verify updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY repository secret. See docs/release-signing.md."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secret. See docs/release-signing.md."
          }
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Codex 额度悬浮窗 ${{ github.ref_name }}
          releaseBody: |
            ## 本次更新 / Release notes

            - 2026-10-16覆盖重建：统一过滤日志、Hook通知、轮询和缓存中的内部及未知来源会话，不再混入普通任务或计数。
            - 保留用户对话、自动化和正式团队对话；新对话需等待来源扫描确认。
            - 已安装旧1.0.6的用户需手动下载安装新包，同版本不会触发升级提示。
            - Rebuilt on 2026-10-16 with verified public-session admission across all snapshot sources.
            - Preserves user chats, automations, and named team chats. Existing 1.0.6 users must manually reinstall this rebuilt package.
            - Windows includes updater-signed artifacts. The Apple Silicon macOS package is not Apple-notarized and remains a test build.

            详细说明见仓库中的 CHANGELOG.md。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
      - name: Publish updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $signatureFile = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe.sig" | Select-Object -First 1
          if ($null -eq $signatureFile) { throw "Updater signature was not generated." }
          $signature = (Get-Content -Raw $signatureFile.FullName).Trim()
          $release = gh release view $tag --json assets | ConvertFrom-Json
          $installer = $release.assets | Where-Object { $_.name -like "*-setup.exe" } | Select-Object -First 1
          if ($null -eq $installer) { throw "Windows installer asset was not found in release $tag." }
          $platforms = [ordered]@{
            "windows-x86_64" = [ordered]@{
              signature = $signature
              url = $installer.url
            }
          }
          # Either platform may finish first; retain an already-published macOS entry.
          $previousManifest = Join-Path $env:RUNNER_TEMP "quotaorb-previous-latest.json"
          gh release download $tag --pattern latest.json --output $previousManifest 2>$null
          if ($LASTEXITCODE -eq 0) {
            $previous = Get-Content -Raw -LiteralPath $previousManifest | ConvertFrom-Json
            $mac = $previous.platforms.'darwin-aarch64'
            if ($null -ne $mac) {
              $platforms["darwin-aarch64"] = [ordered]@{
                signature = $mac.signature
                url = $mac.url
              }
            }
          }
          $manifest = [ordered]@{
            version = "${{ github.ref_name }}" -replace '^v', ''
            notes = "Codex QuotaOrb $tag"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = $platforms
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath latest.json -Encoding utf8NoBOM
          gh release upload $tag latest.json --clobber
