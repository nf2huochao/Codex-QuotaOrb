name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:ui
      - name: Verify updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY repository secret. See docs/release-signing.md."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secret. See docs/release-signing.md."
          }
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Codex 额度悬浮窗 ${{ github.ref_name }}
          releaseBody: |
            ## 本次更新 / Release notes

            - 新增“Codex 重置预测”专栏，显示未来 24 小时重置概率、距上次重置时间、近 30 天重置次数、平均等待时间和最近重置时间。
            - 新增 LunarWerx 来源标识与“查看证据”按钮，公开数据读取失败时显示明确的不可用状态。
            - 近期趋势固定为最近 7 天 × 24 小时的一行细柱，共 168 个位置；真实采样柱为橙色，未采样/沿用数据保持浅绿色。
            - 去除滚轮切换和原生滑轨，保持悬浮球、详情页和手机局域网网页的任务快照、Token、套餐和额度逻辑一致。
            - Signed Windows installer and updater manifest are included when repository signing secrets are configured.

            详细说明见仓库中的 CHANGELOG.md。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
      - name: Publish updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $signatureFile = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe.sig" | Select-Object -First 1
          if ($null -eq $signatureFile) { throw "Updater signature was not generated." }
          $signature = (Get-Content -Raw $signatureFile.FullName).Trim()
          $release = gh release view $tag --json assets | ConvertFrom-Json
          $installer = $release.assets | Where-Object { $_.name -like "*-setup.exe" } | Select-Object -First 1
          if ($null -eq $installer) { throw "Windows installer asset was not found in release $tag." }
          $manifest = [ordered]@{
            version = "${{ github.ref_name }}" -replace '^v', ''
            notes = "Codex QuotaOrb $tag"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = $installer.browserDownloadUrl
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath latest.json -Encoding utf8NoBOM
          gh release upload $tag latest.json --clobber
