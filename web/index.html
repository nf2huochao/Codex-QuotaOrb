  <main class="shell"><div id="pull-refresh" class="pull-refresh" aria-live="polite" aria-hidden="true">下滑刷新</div>
    <noscript><section class="pairing"><h1>Codex 额度</h1><p>此页面需要开启 JavaScript 才能读取局域网快照。</p></section></noscript>
    <section id="pairing" class="pairing" hidden>
      <div class="pair-head"><h1 id="pair-title">等待局域网配对</h1><button id="pair-language-toggle" class="details-language" type="button" aria-label="切换到英文">EN</button></div>

    </section>
    <section id="dashboard" hidden>
      <section id="island" class="island"></section>
      <section id="details" class="details"><div class="details-head"><h1>Codex 额度详情</h1><button id="language-toggle" class="details-language" type="button" aria-label="切换到英文">EN</button></div><small class="weekly-quota-note"></small><div class="grid"></div><div class="fresh"></div><div class="refresh-feedback" aria-live="polite"></div><section class="reset-forecast-card" aria-label="Codex 重置预测"></section><div class="history-card"><div class="history-head"><strong class="history-title">近期趋势</strong><div class="history-head-actions"><small class="history-window"></small><button class="history-toggle" type="button" hidden></button></div></div><div class="history-content"></div></div><div class="task-header"><strong class="task-header-label">任务状态</strong><span class="task-summary"></span></div><div id="tasks"></div></section>
    </section>
  </main>

    if(!token){showPairing();document.querySelector('#pair-form').addEventListener('submit',e=>{e.preventDefault();pairWithCode(document.querySelector('#pair-input').value)})}else showDashboard();
