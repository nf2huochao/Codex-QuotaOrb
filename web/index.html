<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#bdcfa2">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Codex 额度悬浮窗</title>
  <style>
    :root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#495849;background:#bdcfa2}
    *{box-sizing:border-box}html{background:#bdcfa2;min-height:100%;overflow-x:hidden}body{margin:0;min-height:100vh;padding:max(24px,env(safe-area-inset-top)) 12px max(28px,env(safe-area-inset-bottom));background:#bdcfa2;overflow-x:hidden}.shell{max-width:660px;margin:auto;overflow:visible}
    .island{display:grid;grid-template-columns:repeat(3,1fr);padding:7px;border-radius:999px;background:#ebe4d6;box-shadow:14px 16px 26px #64756156,-10px -10px 22px #fffcefd9,inset 2px 2px 5px #84897733}
    .seg{min-width:0;min-height:76px;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 12px}.seg+.seg{border-left:1px solid #75826f2b}.task-status-copy{min-width:0}.task-counts{display:flex;align-items:center;gap:6px;min-height:13px;margin-top:5px}.task-count{display:inline-flex;align-items:center;gap:3px;color:#7d897d;font-size:10px;line-height:1;white-space:nowrap}.task-count-dot{width:7px;height:7px;flex:0 0 7px;display:inline-block;border-radius:50%;background:var(--status-color);box-shadow:1px 1px 2px #5d70583f}.task-count b{font-size:10px;font-weight:700;color:#5f6d60}
    small{display:block;color:#8a9588;font-size:11px;white-space:nowrap}strong{display:block;margin-top:4px;font-size:15px;white-space:nowrap}
    .ring{width:54px;height:54px;display:grid;place-items:center;flex:0 0 54px;border-radius:50%;background:conic-gradient(#ddb480 var(--p),#d9e4d0 0);box-shadow:4px 5px 9px #87917b4d,-3px -3px 7px #fffec4;position:relative}.ring:after{content:"";position:absolute;inset:6px;border-radius:50%;background:#ebe4d6;box-shadow:inset 2px 2px 5px #84897733}.ring b{position:relative;z-index:1}
    .dot{display:inline-block;width:13px;height:13px;border-radius:50%;background:var(--c);box-shadow:0 0 0 5px #fff8,2px 3px 5px #8184745c}
    .details,.pairing{margin-top:16px;padding:18px 20px;border-radius:24px;background:#ebe4d6;box-shadow:14px 16px 26px #64756156,-10px -10px 22px #fffcefd9;overflow:hidden}.details h1{margin:4px 0 16px;font-size:22px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.card{padding:11px;border-radius:15px;box-shadow:inset 2px 2px 5px #84897733}.fresh{margin:14px 0;color:#788474;font-size:12px}.task-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px;font-size:13px}.task-header span{color:#8a9588;font-size:12px}.task{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid #75826f22;font-size:13px}.task>.dot{width:17px;height:17px;flex:0 0 17px;border:5px solid #fffb;box-sizing:content-box;box-shadow:2px 3px 5px #7a80714a,-2px -2px 4px #fff9}.task-copy{flex:1;min-width:0}.task-copy strong,.task-copy small{display:block}.task-copy strong{font-size:13px}.task-copy small{margin-top:3px;color:#8a9588;font-size:11px}.task-activity{color:#788474!important}.task-reason{display:block;color:#aa665b!important;font-size:11px!important;margin-top:2px}.task-actions{display:flex;gap:5px;flex:0 0 auto}.ack,.approval,.pair-submit{border:0;border-radius:999px;background:#ebe4d6;color:#66745f;padding:7px 12px;box-shadow:4px 5px 9px #87917b40,-3px -3px 7px #fffec4;cursor:pointer;font-size:11px}.approval.accept{background:#bdcfae}.approval.decline{background:#f0d8cf;color:#9b5a50}.history-card{margin:12px 0 16px;padding:11px 12px;border-radius:15px;background:#e6dfd0;box-shadow:inset 2px 2px 5px #84897733}.history-head{display:flex;justify-content:space-between;align-items:center;color:#66745f}.history-head small{font-size:10px}.history-summary{display:flex;justify-content:space-between;margin:7px 0 5px;font-size:11px;color:#788474}.history-track{height:34px;display:flex;align-items:end;gap:3px}.history-track i{flex:1;min-width:2px;background:#bdcfae;border-radius:3px 3px 1px 1px}.history-token i{background:#ddb480}.pairing{text-align:center}.pairing p{line-height:1.65}.pairing form{display:flex;gap:8px;margin-top:16px}.pairing input{min-width:0;flex:1;border:0;border-radius:999px;padding:11px 14px;background:#f7f1e6;color:#495849;box-shadow:inset 2px 2px 5px #84897733}.pairing input:focus{outline:2px solid #ddb480}.pair-error{min-height:20px;margin:10px 0 0;color:#aa665b;font-size:12px}.pairing code{display:block;margin-top:12px;padding:10px;word-break:break-all;background:#bdcfa255;border-radius:12px}.pull-refresh{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#66745f;font-size:12px;opacity:0;transition:height .16s ease,opacity .16s ease}.pull-refresh.is-visible{height:34px;opacity:1}
    @media(max-width:560px){body{padding:max(24px,env(safe-area-inset-top)) 8px max(24px,env(safe-area-inset-bottom))}.shell{padding-top:0}.seg{padding:8px 6px;gap:6px}.seg strong{font-size:12px}.ring{width:48px;height:48px;flex-basis:48px}.details{padding:16px}.pairing{margin-top:12vh}.pairing form{display:block}.pairing input,.pair-submit{width:100%}.pair-submit{margin-top:8px}}
    .pull-refresh.is-ready{color:#5b6c55;font-weight:700}.pull-refresh.is-refreshing{height:34px;opacity:1;color:#66745f}.pull-refresh.is-confirmed{height:34px;opacity:1;color:#6f8966;font-weight:700}
  </style>
</head>
<body>
  <main class="shell"><div id="pull-refresh" class="pull-refresh" aria-live="polite" aria-hidden="true">下滑刷新</div>
    <noscript><section class="pairing"><h1>Codex 额度</h1><p>此页面需要开启 JavaScript 才能读取局域网快照。</p></section></noscript>
    <section id="pairing" class="pairing" hidden>
      <h1>等待局域网配对</h1>
      <p>请在 Windows 悬浮窗详情的“配对设置”中查看四位配对码。</p>
      <form id="pair-form"><input id="pair-input" inputmode="numeric" maxlength="4" autocomplete="one-time-code" placeholder="输入四位配对码"><button class="pair-submit" type="submit">连接</button></form>
      <p id="pair-error" class="pair-error"></p>
    </section>
    <section id="dashboard" hidden>
      <section id="island" class="island"></section>
      <section id="details" class="details"><h1>Codex 额度详情</h1><div class="grid"></div><div class="fresh"></div><div class="history-card"><div class="history-head"><strong>近期趋势</strong><small class="history-window"></small></div><div class="history-content"></div></div><div class="task-header"><strong>任务状态</strong><span class="task-summary"></span></div><div id="tasks"></div></section>
    </section>
  </main>
  <script>
    const query=new URLSearchParams(location.search),pairing=document.querySelector('#pairing'),dashboard=document.querySelector('#dashboard');
    const storageKey='codex-pair-token:'+location.origin;
    const color={none:'#a8ada3',needs_action:'#c96e63',running:'#d6a85e',completed:'#87a56e'};
    const PULL_THRESHOLD=52;
    let token=localStorage.getItem(storageKey)||'',latestSnapshot,lastSignature='',reconnectTimer,reconnectDelay=1000,socket,lastChangedAt=-1,lastTransportRank=0,pullStartY=0,pullDistance=0,pulling=false,refreshing=false;
    const pullRefresh=document.querySelector('#pull-refresh');
    const esc=s=>String(s??'--').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmt=x=>x?new Date(x*1000).toLocaleString('zh-CN',{hour12:false}):'--';
    const sourceLabel=source=>source==='app-server-event'?'实时事件':source==='task-watch'?'任务监听':source==='permission-hook'?'批准监听':source==='metrics-poll'?'指标轮询':source==='full-poll'?'完整校准':source==='manual-refresh'?'手动刷新':'';
    const taskStatusCounts=tasks=>tasks.reduce((counts,task)=>{if(!task.acknowledged){const status=task.status||'none';if(status in counts)counts[status]++}return counts},{none:0,needs_action:0,running:0,completed:0});
    const statusLabel=status=>({none:'无活跃任务',needs_action:'需要批准 / 回复 / 确认',running:'正在执行',completed:'已完成，可验收'})[status]||'状态未知';
    const formatTokens=value=>value===undefined||value===null?'--':value>=1000000?(value/1000000).toFixed(1)+'M':value>=1000?(value/1000).toFixed(value>=100000?'0':'1')+'K':String(value);
    function renderHistory(points){
      const normalized=(points||[]).map(point=>({at:Number(point.at??point.timestamp??0),quota:point.quota_remaining_percent??point.quotaRemainingPercent})).filter(point=>point.at);
      const windowLabel=document.querySelector('.history-window'),content=document.querySelector('.history-content');
      const start=new Date();start.setHours(0,0,0,0);
      const slots=Array.from({length:24},(_,index)=>{const at=Math.floor((start.getTime()+index*3600000)/1000);return normalized.find(point=>point.at===at)});
      const values=slots.map(point=>Number(point?.quota??0)),max=Math.max(1,...values),first=slots.find(point=>point?.quota!==undefined)?.quota,last=[...slots].reverse().find(point=>point?.quota!==undefined)?.quota;
      windowLabel.textContent='当天 24 小时';
      content.innerHTML=`<div class="history-summary"><span>额度 ${first??'--'}% → ${last??'--'}%</span><span>${normalized.length?'今日已采样':'暂无成功采样'}</span></div><div class="history-track" aria-label="当天 24 小时额度趋势">${slots.map((point,index)=>`<i class="history-slot${point?' has-value':''}" style="height:${point?Math.max(8,values[index]/max*100):4}%" title="${point?index+':00 · '+point.quota+'%':index+':00 · 暂无数据'}"></i>`).join('')}</div>`;
    }
    function showPairing(message=''){dashboard.hidden=true;pairing.hidden=false;document.querySelector('#pair-error').textContent=message}
    function showDashboard(){pairing.hidden=true;dashboard.hidden=false}
    function extractCode(raw){const value=raw.trim();try{const url=new URL(value,location.href);return url.searchParams.get('pair')||value}catch{return value}}
    async function pairWithCode(raw){
      const code=extractCode(raw);
      if(!/^\d{4}$/.test(code)){document.querySelector('#pair-error').textContent='请输入四位数字配对码';return}
      const button=document.querySelector('.pair-submit');button.disabled=true;
      try{const response=await fetch('/api/pair',{method:'POST',headers:{'content-type':'application/json','cache-control':'no-cache'},body:JSON.stringify({code})});if(!response.ok)throw Error('配对码不正确或服务未启动');const result=await response.json();token=result.token;localStorage.setItem(storageKey,token);history.replaceState(null,'',location.pathname);showDashboard();refresh();connect()}catch(error){showPairing(error.message||'配对失败')}finally{button.disabled=false}
    }
    if(!token){showPairing();document.querySelector('#pair-form').addEventListener('submit',e=>{e.preventDefault();pairWithCode(document.querySelector('#pair-input').value)})}else showDashboard();
    function render(s,transportRank=1){
      const changed=Number(s.changed_at??s.changedAt);
      if(Number.isFinite(changed)){if(changed<lastChangedAt||(changed===lastChangedAt&&transportRank>0&&transportRank<lastTransportRank))return;lastChangedAt=changed;lastTransportRank=Math.max(lastTransportRank,transportRank)}
      const signature=JSON.stringify(s);if(signature===lastSignature)return;lastSignature=signature;latestSnapshot=s;
      const tasks=s.tasks||[],counts=taskStatusCounts(tasks),pct=s.quota_remaining_percent??s.quotaRemainingPercent;
      const statusPriority=['needs_action','completed','running','none'],st=statusPriority.find(status=>counts[status]>0)||'none';
      const taskText=counts.needs_action||counts.running||counts.completed?'任务状态':'无活跃任务';
      const countParts=[];if(counts.needs_action)countParts.push(`<span class="task-count" data-status="needs_action" aria-label="需要批准 ${counts.needs_action}"><i class="task-count-dot" style="--status-color:${color.needs_action}"></i><b>${counts.needs_action}</b></span>`);if(counts.running)countParts.push(`<span class="task-count" data-status="running" aria-label="正在执行 ${counts.running}"><i class="task-count-dot" style="--status-color:${color.running}"></i><b>${counts.running}</b></span>`);if(counts.completed)countParts.push(`<span class="task-count" data-status="completed" aria-label="已完成 ${counts.completed}"><i class="task-count-dot" style="--status-color:${color.completed}"></i><b>${counts.completed}</b></span>`);const countText=countParts.length?countParts.join(''):`<span class="task-count task-count-empty" data-status="none" aria-label="无任务 0"><i class="task-count-dot" style="--status-color:${color.none}"></i><b>0</b></span>`;
      const usageDate=s.usage_date??s.usageDate;const tokenLabel=usageDate?'Token · '+String(usageDate).slice(5):'本日 Token';
      document.querySelector('#island').innerHTML=`<div class="seg"><span class="ring" style="--p:${pct??0}%"><b>${pct===undefined?'--':pct+'%'}</b></span><span><small>本周剩余</small><strong>${s.status==='fresh'?'额度可用':'数据待确认'}</strong></span></div><div class="seg"><span class="dot" style="--c:${color[st]}"></span><span class="task-status-copy"><small>任务状态</small><strong>${taskText}</strong><span class="task-counts" aria-label="任务状态统计">${countText}</span></span></div><div class="seg"><span><small>${tokenLabel}</small><strong>${formatTokens(s.today_tokens??s.todayTokens)}</strong></span></div>`;
      document.querySelector('#details h1').textContent='本周剩余 '+(pct===undefined?'--':pct+'%');document.querySelector('.grid').innerHTML=`<div class="card"><small>下次重置</small><strong>${fmt(s.quota_resets_at??s.quotaResetsAt)}</strong></div><div class="card"><small>当前套餐</small><strong>${esc(s.plan)}</strong></div><div class="card"><small>可用重置机会</small><strong>${esc(s.reset_credits??s.resetCredits)}</strong></div><div class="card"><small>${tokenLabel}</small><strong>${esc(s.today_tokens??s.todayTokens)}</strong></div>`;
      const source=sourceLabel(s.source),sourceSuffix=source?' · '+source:'';
      document.querySelector('.fresh').textContent=s.status==='fresh'?'已连接 · 最近更新 '+fmt(s.fetched_at??s.fetchedAt)+sourceSuffix:(s.status==='stale'?'离线/正在重连 · 保留最后成功数据 · 最后成功于 '+fmt(s.fetched_at??s.fetchedAt):(s.error||'暂时无法读取数据'));
      renderHistory(s.history);document.querySelector('.task-summary').innerHTML=countText;
      document.querySelector('#tasks').innerHTML=tasks.map(t=>{const waitingReason=t.waiting_reason??t.waitingReason,approvalId=t.approval_request_id??t.approvalRequestId,activity=t.activity;return `<div class="task"><i class="dot" style="--c:${color[t.status]||color.none}"></i><span class="task-copy"><strong>${esc(t.title)}</strong>${activity?`<small class="task-activity">当前内容：${esc(activity)}</small>`:''}<small>${statusLabel(t.status)}</small>${t.status==='needs_action'?`<small class="task-reason">${esc(waitingReason||'等待你的批准')}</small>`:''}</span><span class="task-actions">${t.status==='needs_action'&&approvalId?`<button class="approval accept" data-id="${esc(t.id)}" data-decision="accept">批准</button><button class="approval decline" data-id="${esc(t.id)}" data-decision="decline">拒绝</button>`:''}${t.status==='completed'&&!t.acknowledged?`<button class="ack" data-id="${esc(t.id)}">可验收</button>`:''}</span></div>`}).join('')||'<div class="task"><span>暂无任务记录</span></div>';
      document.querySelectorAll('.ack').forEach(button=>button.onclick=async()=>{button.disabled=true;await fetch('/api/tasks/'+encodeURIComponent(button.dataset.id)+'/acknowledge?pair='+encodeURIComponent(token),{method:'POST'});refresh()});
      document.querySelectorAll('.approval').forEach(button=>button.onclick=async()=>{button.disabled=true;try{const response=await fetch('/api/tasks/'+encodeURIComponent(button.dataset.id)+'/approval?pair='+encodeURIComponent(token),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({decision:button.dataset.decision})});if(!response.ok)throw Error(await response.text());await refresh()}catch(error){button.disabled=false;showConnectionError(error.message||'批准请求处理失败')}});
    }
    function showConnectionError(message){render(latestSnapshot?{...latestSnapshot,status:'stale',error:message}:{status:'error',error:message,tasks:[]},0)}
    function invalidatePairing(){localStorage.removeItem(storageKey);token='';if(socket){socket.close();socket=undefined}showPairing('配对已失效，请重新输入四位配对码')}
    async function refresh(){if(!token||refreshing)return;refreshing=true;try{const r=await fetch('/api/snapshot',{headers:{Authorization:'Bearer '+token,'cache-control':'no-cache'},cache:'no-store'});if(r.status===401){invalidatePairing();return}if(!r.ok)throw Error('服务暂时无法访问');render(await r.json(),1)}catch(e){showConnectionError(e.message||'无法连接 Windows 悬浮窗')}finally{refreshing=false}}
    function connect(){
      if(!token||socket&&(socket.readyState===WebSocket.OPEN||socket.readyState===WebSocket.CONNECTING))return;
      try{
        const current=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?pair='+encodeURIComponent(token));socket=current;
        current.onopen=()=>{reconnectDelay=1000;if(reconnectTimer){clearTimeout(reconnectTimer);reconnectTimer=undefined}refresh()};
        current.onmessage=e=>{try{render(JSON.parse(e.data),2)}catch{}};
        current.onerror=()=>current.close();
        current.onclose=()=>{if(socket!==current)return;socket=undefined;showConnectionError('连接已中断，正在重连');if(!reconnectTimer){reconnectTimer=setTimeout(()=>{reconnectTimer=undefined;connect()},reconnectDelay);reconnectDelay=Math.min(reconnectDelay*2,30000)}};
      }catch{reconnectTimer=setTimeout(connect,reconnectDelay);reconnectDelay=Math.min(reconnectDelay*2,30000)}
    }
    if(token){refresh();connect();setInterval(refresh,120000);addEventListener('online',()=>{refresh();connect()});addEventListener('offline',()=>showConnectionError('网络已断开，当前显示上次成功数据'))}
    function resetPull(){pulling=false;pullDistance=0;pullRefresh.classList.remove('is-visible','is-ready','is-refreshing','is-confirmed');pullRefresh.style.height='';pullRefresh.textContent='下滑刷新';pullRefresh.setAttribute('aria-hidden','true')}
    function updatePull(distance){pullDistance=distance;pullRefresh.classList.toggle('is-visible',distance>4);pullRefresh.classList.toggle('is-ready',distance>=PULL_THRESHOLD);pullRefresh.style.height=distance>4?Math.min(70,34+distance*.45)+'px':'';pullRefresh.textContent=distance>=PULL_THRESHOLD?'松开刷新':'下滑刷新';pullRefresh.setAttribute('aria-hidden',distance>4?'false':'true')}
    async function refreshFromPull(){if(!token||refreshing)return;pullRefresh.classList.add('is-visible','is-refreshing');pullRefresh.style.height='34px';pullRefresh.textContent='正在刷新…';pullRefresh.setAttribute('aria-hidden','false');await refresh();const confirmed=Boolean(token&&latestSnapshot?.status==='fresh');pullRefresh.classList.remove('is-refreshing');pullRefresh.classList.toggle('is-confirmed',confirmed);pullRefresh.textContent=confirmed?'已更新 · '+fmt(latestSnapshot?.fetched_at):'同步失败 · 请稍后重试';pullRefresh.style.height='34px';window.setTimeout(resetPull,confirmed?1400:2200)}
    addEventListener('touchstart',e=>{if(token&&scrollY<=0&&e.touches.length===1){pullStartY=e.touches[0].clientY;pullDistance=0;pulling=true}},{passive:true});
    addEventListener('touchmove',e=>{if(!pulling||!e.touches.length)return;const distance=e.touches[0].clientY-pullStartY;if(distance<=0){resetPull();return}updatePull(distance);e.preventDefault()},{passive:false});
    addEventListener('touchend',()=>{if(!pulling)return;const shouldRefresh=pullDistance>=PULL_THRESHOLD;resetPull();if(shouldRefresh)void refreshFromPull()},{passive:true});
    addEventListener('touchcancel',resetPull,{passive:true});
  </script>
</body>
</html>
